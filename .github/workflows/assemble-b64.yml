name: assemble-b64
on:
  push:
    paths:
      - ".github/workflows/assemble-b64.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble Inter-ExtraBold.woff.b64
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import pathlib, hashlib
          root = pathlib.Path("scripts/assets/_b64parts/inter-extrabold")
          parts = []
          for i in range(72):
              raw = (root / f"c{i:03d}.txt").read_bytes()
              parts.append(b"".join(raw.splitlines()))
          data = b"".join(parts)
          if not data.endswith(b"\n"):
              data += b"\n"
          sha = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          print("size", len(data), "sha", sha)
          if len(data) != 85561 or sha != "fd9cc2ac71778176433bfc0f5c0fd0acdbc62661":
              raise SystemExit(1)
          pathlib.Path("scripts/assets/Inter-ExtraBold.woff.b64").write_bytes(data)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/assets/Inter-ExtraBold.woff.b64
          git rm -r scripts/assets/_b64parts/inter-extrabold
          git rm -f .github/workflows/assemble-b64.yml
          git commit -m "Add exact Inter-ExtraBold.woff.b64 and remove staging chunks"
          git push origin HEAD:main
